<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NICO AI Assistant</title>
<link rel="icon" type="image/png" href="nico-logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131314">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{background:#0a0a0f;color:#e6e6ee;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.app-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#12121a;border-bottom:1px solid #1f1f2e}
.nico-logo{width:40px;height:40px;border-radius:50%;object-fit:cover}
.app-title{font-size:18px;font-weight:700}
.status{font-size:11px;color:#22c55e}
#chat{flex:1;overflow-y:auto;padding:16px 16px 90px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.u{background:linear-gradient(135deg,#6366f1,#8b5cf6);align-self:flex-end;border-bottom-right-radius:4px;color:#fff}
.a{background:#1c1c2a;align-self:flex-start;border-bottom-left-radius:4px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:10px 12px;background:#12121a;border-top:1px solid #1f1f2e;align-items:center;z-index:20;overflow-x:auto}
#inp{flex:1;background:#1c1c2a;border:1px solid #2a2a3e;border-radius:24px;padding:12px 16px;color:#e6e6ee;font-size:15px;outline:none;min-width:120px}
#inp:focus{border-color:#6366f1}
.bar button{width:38px;height:38px;border-radius:50%;border:none;background:#1c1c2a;border:1px solid #2a2a3e;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#go{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none}
</style>
</head>
<body>
<header class="app-header">
 <img src="nico-logo.png" alt="NICO" class="nico-logo">
 <div style="flex:1"><div class="app-title">NICO</div><div class="status">● Çevrimiçi</div></div>
</header>

<div id="chat"></div>

<div class="bar">
 <input id="inp" placeholder="NICO'ya yaz..." autocomplete="off">
 <input type="file" id="file" accept="image/*,video/*" style="display:none">
 <button id="cam" title="Medya Yükle">📷</button>
 <button id="mic" title="Dinle">🎙️</button>
 <button id="vc" title="Sesli Sohbet">🗣️</button>
 <button id="tts" title="Seslendirme">🔇</button>
 <button id="voc" title="Ses Değiştir">👤</button>
 <button id="clr" title="Temizle">🧹</button>
 <button id="go" title="Gönder">➤</button>
</div>

<script src="./brain.js"></script>
<script src="./nico.js"></script>
<script src="https://cdn.jotfor.ms/agent/embedjs/019fe14158c07004a50fa0ef7baa0eab3d20/embed.js"></script>
</body>
</html>
